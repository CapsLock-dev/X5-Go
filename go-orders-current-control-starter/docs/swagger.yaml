basePath: /api/v1
definitions:
  handler.ErrorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  order.CreateOrderInput:
    properties:
      items:
        items:
          $ref: '#/definitions/order.Item'
        type: array
    type: object
  order.Item:
    properties:
      name:
        type: string
      price:
        type: integer
      quantity:
        type: integer
    type: object
  order.Order:
    properties:
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/order.Item'
        type: array
      status:
        $ref: '#/definitions/order.Status'
      total_price:
        type: integer
    type: object
  order.Status:
    enum:
    - new
    - processing
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - StatusNew
    - StatusProcessing
    - StatusCompleted
    - StatusCancelled
  order.StatusChange:
    properties:
      changed_at:
        type: string
      status:
        $ref: '#/definitions/order.Status'
    type: object
  order.UpdateStatusInput:
    properties:
      status:
        $ref: '#/definitions/order.Status'
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: Implements order creation, retrieval, status update and history
  title: Order Service API
  version: "1.0"
paths:
  /orders:
    get:
      description: Retrieves list of orders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/order.Order'
            type: array
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get list of orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Creates order, computes total price, assigns ID and new status
      parameters:
      - description: Order items
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Invalid JSON or order
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Retrieves order by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get order
      tags:
      - orders
  /orders/{id}/history:
    get:
      description: Get status update history for order by given ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/order.StatusChange'
            type: array
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get history
      tags:
      - orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update status of order with given ID.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/order.UpdateStatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Invalid status
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Forbidden status transition
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update status
      tags:
      - orders
schemes:
- http
swagger: "2.0"
